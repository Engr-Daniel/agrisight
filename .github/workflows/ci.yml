name: Foundation CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -r requirements/m4.lock
          python -m pip install --no-build-isolation --no-deps -e ".[dev,e1,reporting]"
          python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts/m4_browser_review.py streamlit_app.py
      - name: Smoke tests
        run: python -m pytest -q
