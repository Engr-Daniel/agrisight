[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrisight"
version = "0.0.1"
description = "Learning-oriented agricultural analytics engineering project (M0 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Oyewale Daniel"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
e1 = ["pandas==2.3.3"]
reporting = ["streamlit==1.66.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agrisight = ["sql/*.sql", "reporting/*.json", "assets/*.css", "assets/*.webp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
